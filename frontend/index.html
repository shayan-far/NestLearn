<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NestLearn · Library</title>
  <script>if(new URLSearchParams(location.search).get('lesson'))location.replace('/lesson.html'+location.search);try{document.documentElement.dataset.theme=localStorage.getItem('nl-theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
  <link rel="stylesheet" href="/style.css?v=3">
</head>
<body>
  <main class="page">
    <section class="hero reveal">
      <span class="eyebrow">Lesson library</span>
      <h1>Lessons that notice when you're stuck.</h1>
      <p>Pick a lesson. NestLearn calibrates to you for ten seconds, then quietly offers a different explanation when a part isn't landing.</p>
    </section>
    <div id="grid" class="grid"></div>
  </main>
  <script src="/common.js?v=3"></script>
  <script>
    (async () => {
      const { el, icon } = NL;
      const { lessons } = await NL.nav({ active: 'library' });
      const grid = NL.$('#grid');
      if (!lessons.length) {
        grid.append(el('div', 'card empty', 'No lessons yet. Drop a lesson .json into lessons/ and restart the server.'));
        return;
      }
      lessons.forEach((l, i) => {
        const level = l.difficulty === null ? null : Math.max(1, Math.round(l.difficulty * 5));
        const diff = level ? el('span', { class: 'diff', title: `Difficulty ${level}/5` },
          [1, 2, 3, 4, 5].map((k) => el('i', k <= level ? 'on' : ''))) : null;
        const card = el('a', { class: 'card lesson-card reveal', href: `/lesson.html?lesson=${encodeURIComponent(l.id)}`,
          style: { animationDelay: `${i * 70}ms` } },
          l.subject ? el('span', 'eyebrow', l.subject) : null,
          el('h2', null, l.title),
          el('p', null, l.description),
          el('div', 'chips', l.tags.map((t) => el('span', 'chip', t))),
          el('div', 'meta',
            el('span', null, `${l.segments} parts`), el('span', null, `~${l.minutes} min`),
            l.quizzes ? el('span', null, `${l.quizzes} checks`) : null, diff),
          el('span', 'go', icon('arrow')));
        grid.append(card);
      });
    })();
  </script>
</body>
</html>
